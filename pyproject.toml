[tool.black]
line-length = 88
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.eggs
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.bumpversion]
current_version = "1.0.1"
commit = true
tag = true
tag_name = "{new_version}"

[[tool.bumpversion.files]]
filename = "setup.py"
search = 'version="{current_version}"'
replace = 'version="{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGES.md"
search = "## Unreleased"
replace = """## Unreleased

## [{new_version}] - {utcnow:%Y-%m-%d}"""
