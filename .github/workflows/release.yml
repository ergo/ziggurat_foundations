name: Publish to PyPI

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  publish:
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ziggurat-foundations
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: make build
      - uses: pypa/gh-action-pypi-publish@release/v1
