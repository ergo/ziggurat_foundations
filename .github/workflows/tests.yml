name: Tests

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: make lint

  matrix:
    runs-on: ubuntu-latest
    outputs:
      envlist: ${{ steps.generate.outputs.envlist }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[ci]"
      - id: generate
        env:
          TOX_SKIP_ENV: "^lint$"
        run: python -m tox --gh-matrix

  test:
    needs: [lint, matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tox: ${{ fromJSON(needs.matrix.outputs.envlist) }}
    name: Tests (${{ matrix.tox.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.tox.python.version }}
      - run: make test TOX_ENV="${{ matrix.tox.name }}"
